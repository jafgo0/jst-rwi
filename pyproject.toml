[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jst-rwi"
version = "0.5.0"
description = "JU Solar Team Race Weather Intelligence - meteorological and race decision-support platform for BWSC 2027"
requires-python = ">=3.12"
license = { text = "Proprietary - JU Solar Team (license decision pending, see docs/adr/0002-license.md)" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "httpx>=0.27",
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.14",
  "pvlib>=0.11",
  # Reads the Himawari netCDF4/HDF5 tiles. pvlib happens to pull h5py in today,
  # but depending on a transitive dependency for a module's core reader is how
  # you get a mystery failure the day an upstream package drops it. We import
  # it, so we declare it.
  "h5py>=3.11",
  "pyproj>=3.7",
  "timezonefinder>=6.5",
  "gpxpy>=1.6",
  # NASA Earthdata (CMR search, EDL authentication, HTTPS and S3 downloads).
  # Used by scripts/validation/ to pull MERRA-2 and SatCORPS Himawari-9
  # cloud/radiation granules; no runtime path imports it.
  "earthaccess>=0.19",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7", "mypy>=1.13"]
# ADR 0008: ECMWF AIFS GRIB ingest + quantile ML post-processing. Optional; core and
# `make check` run without it (heavy imports are lazy, tests use importorskip).
ml = [
    "ecmwf-opendata>=0.3",
    "xarray>=2024.10",
    "cfgrib>=0.9.14",
    "eccodes>=2.37",
    "lightgbm>=4.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rwi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "network: test requires live internet access to an external provider",
  "science: scientific correctness test with documented reference values",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Keep a bare `ruff check` in agreement with what CI checks (`ruff check src
# tests`). data/routes/build_stuart_highway_route.py is a one-off provenance
# record of how the route GeoJSON was produced, kept so the derivation is
# auditable; it is not imported by the application and does not carry the
# annotation rules that production code does. Excluding it explicitly is
# honest; leaving it to fail only on a bare invocation is just confusing.
extend-exclude = ["data/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "ANN"]
ignore = ["ANN401", "B008"]

[tool.ruff.lint.per-file-ignores]
# ANN: test functions do not need return annotations.
# SIM300: asserting `REGULATORY_CONSTANT == pytest.approx(expected)` reads in the
# natural order for a test whose subject is the constant; flipping it to put the
# expected value first would obscure what is under test.
"tests/**" = ["ANN", "SIM300"]

[tool.mypy]
python_version = "3.12"
packages = ["rwi"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
