name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create environment
        run: |
          # --frozen: install exactly uv.lock; fail if pyproject and lock disagree.
          uv sync --frozen --python 3.12 --extra dev

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Type check
        run: .venv/bin/mypy src/rwi

      - name: Tests
        # Network-marked tests are excluded: CI must not depend on an external
        # weather provider being up, and a provider outage is not a code
        # regression.
        #
        # Do NOT set RWI_ALLOW_NETWORK=false here. It looks like a safety belt
        # but it is not: the provider base checks that flag and refuses *before*
        # respx can serve a mocked response, so the adapter tests stop
        # exercising the code they exist to test and fail with
        # ProviderUnavailableError. Three tests failed that way on the first CI
        # run. What actually prevents stray real requests is respx itself: a
        # mocked test raises on any request it did not register, and anything
        # that genuinely calls out is marked `network` and deselected above.
        # The offline refusal has its own dedicated tests, which set the flag
        # themselves.
        run: .venv/bin/pytest tests -q -m "not network" --durations=10

      - name: Scientific reference tests
        run: .venv/bin/pytest tests -q -m "science" --durations=0

  ml:
    # ADR 0008 §7: rwi.ml and the AIFS GRIB provider import their heavy
    # dependencies lazily and their tests importorskip, so the `quality` job
    # above (no [ml] extra) skips them. This job is where they actually run.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Create environment
        run: |
          uv sync --frozen --python 3.12 --extra dev --extra ml

      - name: ML stack imports
        # Fails loudly if the extra is broken, instead of every ML test being
        # importorskipped into a green run that tested nothing.
        run: |
          .venv/bin/python -c "import lightgbm, xarray, cfgrib, eccodes, ecmwf.opendata; \
          print('eccodes', eccodes.codes_get_api_version(), 'lightgbm', lightgbm.__version__)"

      - name: Type check (with ML stubs present)
        run: .venv/bin/mypy src/rwi

      - name: Tests
        run: .venv/bin/pytest tests -q -m "not network" -rs --durations=10

      - name: Scientific reference tests
        run: .venv/bin/pytest tests -q -m "science" -rs --durations=0
